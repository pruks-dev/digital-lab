<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="sans-serif">
  <style>
    .gate { fill: white; stroke: #333; stroke-width: 2; }
    .wire { stroke: #333; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #333; stroke-width: 2.5; fill: none; }
    .label { text-anchor: middle; font-size: 14px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
  </style>

  <rect class="gate" x="80" y="30" width="100" height="140" rx="4"/>
  <text x="130" y="62" class="label" font-weight="bold">S</text>
  <text x="130" y="100" class="label" font-size="12">RS</text>
  <text x="130" y="118" class="label" font-size="10">FF</text>
  <text x="130" y="148" class="label" font-weight="bold">R</text>

  <!-- S input -->
  <line class="wire" x1="10" y1="55" x2="80" y2="55"/>
  <text x="10" y="50" class="label" font-size="12">S</text>

  <!-- R input -->
  <line class="wire" x1="10" y1="145" x2="80" y2="145"/>
  <text x="10" y="140" class="label" font-size="12">R</text>

  <!-- CLK input with arrow -->
  <line class="wire" x1="10" y1="100" x2="50" y2="100"/>
  <line class="wire" x1="50" y1="100" x2="50" y2="90"/>
  <line class="wire" x1="50" y1="90" x2="80" y2="90"/>
  <polyline class="wire" points="45,85 50,90 55,85" fill="none"/>
  <text x="10" y="95" class="label" font-size="12">CLK</text>

  <!-- Q output -->
  <line class="wire-thick" x1="180" y1="55" x2="250" y2="55"/>
  <text x="260" y="59" class="label" font-weight="bold">Q</text>

  <!-- Q̄ output -->
  <line class="wire-thick" x1="180" y1="145" x2="250" y2="145"/>
  <text x="260" y="149" class="label" font-weight="bold">Q̅</text>
</svg>

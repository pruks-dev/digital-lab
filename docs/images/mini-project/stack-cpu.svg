<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="sans-serif">
  <style>
    .box { fill: #f0f4ff; stroke: #333; stroke-width: 2; }
    .rom { fill: #fff7e6; stroke: #333; stroke-width: 2; }
    .wire { stroke: #333; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #333; stroke-width: 2.5; fill: none; }
    .ctrl { stroke: #333; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .label { text-anchor: middle; font-size: 13px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
    .label-start { text-anchor: start; }
    .label-end { text-anchor: end; }
    .in { text-anchor: end; font-size: 13px; font-weight: bold; fill: #333; }
    .in-sm { text-anchor: end; font-size: 10px; fill: #888; }
    .out { text-anchor: start; font-size: 13px; font-weight: bold; fill: #333; }
    .out-sm { text-anchor: start; font-size: 10px; fill: #888; }
    .dot { fill: #333; }
    .title { text-anchor: middle; font-size: 15px; font-weight: bold; fill: #333; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- ============ DATAPATH: Clock Divider ============ -->
  <rect class="box" x="40" y="112" width="160" height="56" rx="4"/>
  <text x="120" y="134" class="label" font-weight="bold">Clock Divider</text>
  <text x="120" y="152" class="label-sm">50 MHz → 1 Hz</text>

  <!-- ============ DATAPATH: PC ============ -->
  <rect class="box" x="285" y="112" width="110" height="56" rx="4"/>
  <text x="340" y="134" class="label" font-weight="bold">PC</text>
  <text x="340" y="152" class="label-sm">4-bit</text>

  <!-- ============ DATAPATH: Program ROM ============ -->
  <rect class="rom" x="465" y="95" width="190" height="90" rx="4"/>
  <text x="560" y="125" class="label" font-weight="bold">Program ROM</text>
  <text x="560" y="145" class="label-sm">16 × 16-bit</text>
  <text x="560" y="163" class="label-sm">opcode | operand</text>

  <!-- ============ DATAPATH: Stack ============ -->
  <rect class="box" x="715" y="95" width="160" height="90" rx="4"/>
  <text x="795" y="125" class="label" font-weight="bold">Stack</text>
  <text x="795" y="145" class="label-sm">8 × 8-bit + SP</text>
  <text x="795" y="163" class="label-sm">full / empty check</text>

  <!-- ============ DATAPATH: ALU ============ -->
  <polygon class="box" points="950,100 1130,118 1130,162 950,180"/>
  <text x="1040" y="132" class="label" font-weight="bold">ALU</text>
  <text x="1040" y="152" class="label-sm">ADD / SUB / MUL + flag</text>

  <!-- ============ WIRE: Clock Divider → PC (tick) ============ -->
  <line class="wire" x1="200" y1="140" x2="285" y2="140" marker-end="url(#arrow)"/>
  <text x="242" y="131" class="label-sm">tick ~1 Hz</text>

  <!-- ============ WIRE: PC → ROM (addr) ============ -->
  <line class="wire-thick" x1="395" y1="140" x2="465" y2="140" marker-end="url(#arrow)"/>
  <text x="430" y="131" class="label-sm">addr</text>

  <!-- ============ WIRE: ROM → Stack (operand) + dot สำหรับ opcode ============ -->
  <line class="wire-thick" x1="655" y1="140" x2="715" y2="140" marker-end="url(#arrow)"/>
  <circle cx="690" cy="140" r="3" class="dot"/>
  <text x="685" y="131" class="label-sm">operand</text>

  <!-- ============ WIRE: Stack → ALU (TOS) ============ -->
  <line class="wire-thick" x1="875" y1="140" x2="950" y2="140" marker-end="url(#arrow)"/>
  <text x="912" y="131" class="label-sm">TOS</text>

  <!-- ============ WIRE: ALU result → Stack (push กลับ) ============ -->
  <path class="wire-thick" d="M1130,140 H1160 V60 H795 V95" marker-end="url(#arrow)"/>
  <text x="977" y="54" class="label-sm">result (push)</text>

  <!-- ============ CONTROL: stack_cpu FSM ============ -->
  <rect class="box" x="460" y="330" width="280" height="95" rx="4"/>
  <text x="600" y="360" class="label" font-weight="bold">stack_cpu (FSM)</text>
  <text x="600" y="382" class="label-sm">FETCH → EXECUTE → HALT</text>
  <text x="600" y="402" class="label-sm">decode opcode → control</text>

  <!-- ============ CTRL WIRE: opcode → FSM (จาก dot บนเส้น operand) ============ -->
  <path class="ctrl" d="M690,140 V330" marker-end="url(#arrow)"/>
  <text x="700" y="245" class="label-sm label-start">opcode</text>

  <!-- ============ CTRL WIRE: tick → FSM (แตกจากเส้น tick) ============ -->
  <circle cx="240" cy="140" r="3" class="dot"/>
  <path class="wire" d="M240,140 V377 H460" marker-end="url(#arrow)"/>

  <!-- ============ CTRL WIRE: FSM → PC (pc_en) ============ -->
  <path class="ctrl" d="M460,355 H340 V168" marker-end="url(#arrow)"/>
  <text x="405" y="346" class="label-sm">pc_en</text>

  <!-- ============ CTRL WIRE: FSM → Stack (push / pop / en) ============ -->
  <path class="ctrl" d="M740,355 H795 V185" marker-end="url(#arrow)"/>
  <text x="789" y="346" class="label-sm label-end">push / pop / en</text>

  <!-- ============ CTRL WIRE: FSM → ALU (alu_sel) ============ -->
  <path class="ctrl" d="M740,400 H920 V170 H950" marker-end="url(#arrow)"/>
  <text x="767" y="391" class="label-sm">alu_sel</text>

  <!-- ============ OUTPUT: TOS → bin_to_bcd ============ -->
  <path class="wire-thick" d="M812,185 V470 H700 V500" marker-end="url(#arrow)"/>
  <text x="756" y="462" class="label-sm">TOS</text>

  <rect class="box" x="620" y="500" width="160" height="56" rx="4"/>
  <text x="700" y="533" class="label" font-weight="bold">bin_to_bcd ×2</text>

  <!-- ============ OUTPUT: HEX ============ -->
  <line class="wire-thick" x1="620" y1="528" x2="495" y2="528" marker-end="url(#arrow)"/>
  <text x="487" y="524" class="label-sm label-end">HI → HEX5–3</text>
  <text x="487" y="542" class="label-sm label-end">LO → HEX2–0</text>

  <!-- ============ OUTPUT: LEDR ============ -->
  <path class="wire-thick" d="M500,425 V455" marker-end="url(#arrow)"/>
  <text x="512" y="444" class="label-sm label-start">PC → LEDR3–0 · SP → LEDR6–4</text>
  <text x="512" y="460" class="label-sm label-start">flag → LEDR9 · err → LEDR8</text>

  <!-- ============ RAIL: reset (KEY1) ============ -->
  <text x="235" y="582" class="label-sm">reset (KEY1): PC = 0, SP = 0</text>
  <line class="wire-thick" x1="140" y1="590" x2="830" y2="590"/>
  <circle cx="370" cy="590" r="3" class="dot"/>
  <path class="wire-thick" d="M370,590 V168" marker-end="url(#arrow)"/>
  <path class="wire-thick" d="M830,590 V185" marker-end="url(#arrow)"/>

  <!-- ============ RAIL: Clk (50 MHz) ============ -->
  <text x="225" y="612" class="label-sm">Clk (50 MHz)</text>
  <line class="wire" x1="140" y1="620" x2="855" y2="620"/>
  <circle cx="310" cy="620" r="3" class="dot"/>
  <path class="wire" d="M140,620 V168" marker-end="url(#arrow)"/>
  <path class="wire" d="M310,620 V168" marker-end="url(#arrow)"/>
  <path class="wire" d="M855,620 V185" marker-end="url(#arrow)"/>

  <!-- ============ TITLE ============ -->
  <text x="600" y="668" class="title">Simple Stack CPU — ภาพรวมระบบ (Control + Datapath)</text>
</svg>

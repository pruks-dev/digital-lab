<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="sans-serif">
  <style>
    .gate { fill: white; stroke: #333; stroke-width: 2; }
    .box { fill: #f0f4ff; stroke: #333; stroke-width: 2; }
    .wire { stroke: #333; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #333; stroke-width: 2.5; fill: none; }
    .label { text-anchor: middle; font-size: 13px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
    .dot { fill: #333; }
  </style>

  <!-- Inputs -->
  <text x="20" y="104" class="label" font-weight="bold">A[3:0]</text>
  <text x="20" y="124" class="label" font-weight="bold">B[3:0]</text>
  <text x="20" y="154" class="label" font-weight="bold">KEY1</text>
  <text x="20" y="174" class="label" font-weight="bold">KEY0</text>

  <!-- 2's Complement -->
  <rect class="box" x="140" y="100" width="110" height="70" rx="4"/>
  <text x="195" y="125" class="label" font-weight="bold">2's Comp</text>
  <text x="195" y="145" class="label-sm">~B + 1 (ลบ)</text>

  <!-- Adder -->
  <rect class="box" x="290" y="80" width="100" height="100" rx="4"/>
  <text x="340" y="125" class="label" font-weight="bold">Adder</text>
  <text x="340" y="145" class="label-sm">4-bit</text>

  <!-- Register -->
  <rect class="box" x="430" y="90" width="100" height="70" rx="4"/>
  <text x="480" y="120" class="label" font-weight="bold">Register</text>
  <text x="480" y="140" class="label-sm">Hold result</text>

  <!-- Abs -->
  <rect class="box" x="570" y="90" width="80" height="70" rx="4"/>
  <text x="610" y="120" class="label" font-weight="bold">Abs</text>
  <text x="610" y="140" class="label-sm">|x|</text>

  <!-- bin_to_bcd -->
  <rect class="box" x="690" y="90" width="100" height="70" rx="4"/>
  <text x="740" y="120" class="label" font-weight="bold">bin_to_bcd</text>
  <text x="740" y="140" class="label-sm">5-bit → BCD</text>

  <!-- bcd_to_7seg (tens) -->
  <rect class="box" x="830" y="70" width="100" height="50" rx="4"/>
  <text x="880" y="97" class="label" font-weight="bold">bcd_to_7seg</text>

  <!-- bcd_to_7seg (units) -->
  <rect class="box" x="830" y="140" width="100" height="50" rx="4"/>
  <text x="880" y="167" class="label" font-weight="bold">bcd_to_7seg</text>

  <!-- Outputs -->
  <text x="970" y="101" class="label" font-weight="bold">HEX1</text>
  <text x="970" y="171" class="label" font-weight="bold">HEX0</text>
  <text x="970" y="248" class="label" font-weight="bold">HEX5</text>
  <text x="970" y="264" class="label-sm">"−" when negative (เมื่อติดลบ)</text>

  <!-- Wire: A to Adder -->
  <line class="wire-thick" x1="40" y1="100" x2="290" y2="100"/>

  <!-- Wire: B to 2's Comp -->
  <line class="wire-thick" x1="40" y1="120" x2="140" y2="120"/>

  <!-- Wire: KEY1 to 2's Comp -->
  <line class="wire" x1="40" y1="150" x2="140" y2="150"/>

  <!-- Wire: KEY0 to Adder -->
  <line class="wire" x1="40" y1="170" x2="290" y2="170"/>

  <!-- Wire: 2's Comp to Adder -->
  <line class="wire-thick" x1="250" y1="130" x2="290" y2="130"/>

  <!-- Wire: Adder to Register -->
  <line class="wire-thick" x1="390" y1="120" x2="430" y2="120"/>

  <!-- Wire: Register to Abs -->
  <line class="wire-thick" x1="530" y1="120" x2="570" y2="120"/>

  <!-- Wire: Abs to bin_to_bcd -->
  <line class="wire-thick" x1="650" y1="120" x2="690" y2="120"/>

  <!-- Wire: bin_to_bcd bcd1 to bcd_to_7seg (tens) — turn before block edge -->
  <path class="wire" d="M790,105 V95 H830"/>

  <!-- Wire: bin_to_bcd bcd0 to bcd_to_7seg (units) — turn before block edge -->
  <path class="wire" d="M790,145 V165 H830"/>

  <!-- Wire: bcd_to_7seg to HEX1 (stop before label) -->
  <line class="wire-thick" x1="930" y1="95" x2="950" y2="95"/>

  <!-- Wire: bcd_to_7seg to HEX0 (stop before label) -->
  <line class="wire-thick" x1="930" y1="165" x2="950" y2="165"/>

  <!-- Wire: negative to HEX5 (down from Register, right — stop before label) -->
  <path class="wire" d="M480,160 V240 H950"/>

  <!-- Title -->
  <text x="550" y="300" class="label" font-size="15" font-weight="bold">Basic Calculator (เครื่องคิดเลขพื้นฐาน)</text>
  <text x="550" y="322" class="label-sm">KEY0 = Add (A + B), KEY1 = Subtract (A + ~B + 1) — result stays on display until next press (ผลลัพธ์ค้างบนจอจนกว่าจะกดปุ่มใหม่)</text>
</svg>
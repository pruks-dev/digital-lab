<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 472" font-family="sans-serif">
  <style>
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .guide { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .tick { stroke: #bbb; stroke-width: 1; stroke-dasharray: 2 4; }
    .sig { font-size: 13px; fill: #333; font-weight: bold; }
    .pin { font-size: 10px; fill: #888; }
    .note { font-size: 11px; fill: #666; }
    .axis-label { font-size: 11px; fill: #666; }
  </style>

  <!-- vertical grid -->
  <line class="grid" x1="80" y1="16" x2="80" y2="430"/>
  <line class="grid" x1="128" y1="16" x2="128" y2="430"/>
  <line class="grid" x1="176" y1="16" x2="176" y2="430"/>
  <line class="grid" x1="224" y1="16" x2="224" y2="430"/>
  <line class="grid" x1="272" y1="16" x2="272" y2="430"/>
  <line class="grid" x1="320" y1="16" x2="320" y2="430"/>
  <line class="grid" x1="368" y1="16" x2="368" y2="430"/>
  <line class="grid" x1="416" y1="16" x2="416" y2="430"/>
  <line class="grid" x1="464" y1="16" x2="464" y2="430"/>
  <line class="grid" x1="512" y1="16" x2="512" y2="430"/>
  <line class="grid" x1="560" y1="16" x2="560" y2="430"/>

  <!-- sampling ticks at rising edges -->
  <line class="tick" x1="128" y1="16" x2="128" y2="430"/>
  <line class="tick" x1="224" y1="16" x2="224" y2="430"/>
  <line class="tick" x1="320" y1="16" x2="320" y2="430"/>
  <line class="tick" x1="416" y1="16" x2="416" y2="430"/>
  <line class="tick" x1="512" y1="16" x2="512" y2="430"/>

  <!-- CLK (KEY0) : active-low button, pressed = 0, released = 1 -->
  <text x="8" y="44" class="sig">CLK</text>
  <text x="8" y="58" class="pin">(KEY0)</text>
  <polyline class="wire" points="80,52 128,52 128,28 176,28 176,52 224,52 224,28 272,28 272,52 320,52 320,28 368,28 368,52 416,52 416,28 464,28 464,52 512,52 512,28 560,28"/>

  <!-- D3 (SW3) : pulses mid-period, ignored by Q until edges -->
  <text x="8" y="90" class="sig">D3</text>
  <text x="8" y="104" class="pin">(SW3)</text>
  <polyline class="wire" points="80,98 160,98 160,74 176,74 176,98 332,98 332,74 380,74 380,98 404,98 404,74 472,74 472,98 496,98 496,74 560,74"/>

  <!-- D2 (SW2) : pulses mid-period -->
  <text x="8" y="136" class="sig">D2</text>
  <text x="8" y="150" class="pin">(SW2)</text>
  <polyline class="wire" points="80,144 100,144 100,120 124,120 124,144 184,144 184,120 208,120 208,144 248,144 248,120 356,120 356,144 440,144 440,120 560,120"/>

  <!-- D1 (SW1) : pulses mid-period -->
  <text x="8" y="182" class="sig">D1</text>
  <text x="8" y="196" class="pin">(SW1)</text>
  <polyline class="wire" points="80,190 152,190 152,166 248,166 248,190 280,190 280,166 304,166 304,190 440,190 440,166 528,166 528,190 552,190 552,166 560,166"/>

  <!-- D0 (SW0) : pulses mid-period -->
  <text x="8" y="228" class="sig">D0</text>
  <text x="8" y="242" class="pin">(SW0)</text>
  <polyline class="wire" points="80,236 152,236 152,212 212,212 212,236 220,236 220,212 380,212 380,236 404,236 404,212 560,212"/>

  <!-- Q3-Q0 (LED3-LED0) : blank rows for students -->
  <text x="8" y="274" class="sig">Q3</text>
  <text x="8" y="288" class="pin">(LED3)</text>
  <line class="guide" x1="80" y1="258" x2="560" y2="258"/>
  <line class="guide" x1="80" y1="282" x2="560" y2="282"/>

  <text x="8" y="320" class="sig">Q2</text>
  <text x="8" y="334" class="pin">(LED2)</text>
  <line class="guide" x1="80" y1="304" x2="560" y2="304"/>
  <line class="guide" x1="80" y1="328" x2="560" y2="328"/>

  <text x="8" y="366" class="sig">Q1</text>
  <text x="8" y="380" class="pin">(LED1)</text>
  <line class="guide" x1="80" y1="350" x2="560" y2="350"/>
  <line class="guide" x1="80" y1="374" x2="560" y2="374"/>

  <text x="8" y="412" class="sig">Q0</text>
  <text x="8" y="426" class="pin">(LED0)</text>
  <line class="guide" x1="80" y1="396" x2="560" y2="396"/>
  <line class="guide" x1="80" y1="420" x2="560" y2="420"/>

  <!-- time axis -->
  <line class="wire" x1="80" y1="444" x2="554" y2="444"/>
  <polyline class="wire" points="554,440 560,444 554,448"/>
  <text x="80" y="462" class="note">นักศึกษาวาด Q หลังขอบขึ้นแต่ละจุด (เส้นประแนวตั้ง) — D เปลี่ยนกลางคาบแล้ว Q ต้องนิ่งจนถึงขอบถัดไป</text>
  <text x="560" y="462" class="axis-label" text-anchor="end">เวลา →</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 1460 460" font-family="sans-serif">
  <style>
    .gate { fill: white; stroke: #333; stroke-width: 2; }
    .box { fill: #f0f4ff; stroke: #333; stroke-width: 2; }
    .wire { stroke: #333; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #333; stroke-width: 2.5; fill: none; }
    .label { text-anchor: middle; font-size: 13px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
    .dot { fill: #333; }
  </style>

  <!-- ============ INPUTS (ซ้ายสุด) ============ -->
  <text x="40" y="45" class="label" font-weight="bold" text-anchor="end">
    <tspan x="40" dy="0">Clk</tspan>
    <tspan x="40" dy="15">50 MHz</tspan>
  </text>
  <text x="40" y="105" class="label" font-weight="bold" text-anchor="end">A[3:0]</text>
  <text x="40" y="200" class="label" font-weight="bold" text-anchor="end">B[3:0]</text>
  <text x="40" y="300" class="label" font-weight="bold" text-anchor="end">KEY0</text>
  <text x="40" y="340" class="label" font-weight="bold" text-anchor="end">KEY1</text>

  <!-- ============ BLOCK 1: Edge Detect (x=110..210, y=280..360) ============ -->
  <rect class="box" x="110" y="280" width="100" height="80" rx="4"/>
  <text x="160" y="320" class="label" dominant-baseline="middle" font-weight="bold">Edge Detect</text>

  <!-- ============ BLOCK 2: B / B̄+1 (x=285..365, y=170..230) ============ -->
  <rect class="box" x="285" y="170" width="80" height="60" rx="4"/>
  <text x="325" y="200" class="label" dominant-baseline="middle" font-weight="bold">B / <tspan text-decoration="overline">B</tspan>+1</text>

  <!-- ============ BLOCK 3: Adder 6-bit (trapezoid: ซ้ายยาว 70 / ขวาสั้น 40, กว้าง 80) ============ -->
  <polygon class="box" points="440,85 520,100 520,140 440,155"/>
  <text x="480" y="115" class="label" dominant-baseline="middle" font-weight="bold">Adder</text>
  <text x="480" y="132" class="label-sm" dominant-baseline="middle">6-bit</text>

  <!-- ============ BLOCK 4: Result Register (x=595..715, y=90..150) ============ -->
  <rect class="box" x="595" y="90" width="120" height="60" rx="4"/>
  <text x="655" y="115" class="label" dominant-baseline="middle" font-weight="bold">Register</text>
  <text x="655" y="132" class="label-sm" dominant-baseline="middle">6-bit</text>

  <!-- ============ BLOCK 5: Sign & Abs (x=790..890, y=90..150) ============ -->
  <rect class="box" x="790" y="90" width="100" height="60" rx="4"/>
  <text x="840" y="120" class="label" dominant-baseline="middle" font-weight="bold">Sign &amp; Abs</text>

  <!-- ============ BLOCK 6: bin_to_bcd (x=965..1075, y=100..160) ============ -->
  <rect class="box" x="965" y="100" width="110" height="60" rx="4"/>
  <text x="1020" y="125" class="label" dominant-baseline="middle" font-weight="bold">bin_to_bcd</text>
  <text x="1020" y="142" class="label-sm" dominant-baseline="middle">5-bit → BCD</text>

  <!-- ============ BLOCK 7a: bcd_to_7seg tens (x=1145..1255, y=70..120) ============ -->
  <rect class="box" x="1145" y="70" width="110" height="50" rx="4"/>
  <text x="1200" y="95" class="label" dominant-baseline="middle" font-weight="bold">bcd_to_7seg</text>

  <!-- ============ BLOCK 7b: bcd_to_7seg units (x=1145..1255, y=140..190) ============ -->
  <rect class="box" x="1145" y="140" width="110" height="50" rx="4"/>
  <text x="1200" y="165" class="label" dominant-baseline="middle" font-weight="bold">bcd_to_7seg</text>

  <!-- ============ OUTPUTS (ขวาสุด) ============ -->
  <text x="1310" y="40" class="label" font-weight="bold">HEX2[6]</text>
  <text x="1310" y="60" class="label-sm">"−" เมื่อติดลบ</text>
  <text x="1320" y="101" class="label" font-weight="bold">HEX1[7:0]</text>
  <text x="1320" y="171" class="label" font-weight="bold">HEX0[7:0]</text>

  <!-- ============ WIRES ============ -->

  <!-- clk 50MHz → branch ที่ (145,60) แล้วลงมา Edge Detect (กลางบน) -->
  <path class="wire" d="M70,60 H160 V280"/>

  <!-- clk → Result Register (กลางบน): branch ที่ (145,60) ไปขวา แล้วลงมา -->
  <path class="wire" d="M160,60 H655 V90"/>

  <!-- Junction dot ที่ branch -->
  <circle cx="160" cy="60" r="3" class="dot"/>

  <!-- A[3:0] → Adder (กลางซ้ายบน): แนวนอนตรง -->
  <line class="wire-thick" x1="70" y1="105" x2="440" y2="105"/>
  <text x="242" y="90" class="label-sm">A[3:0]</text>

  <!-- B[3:0] → B / B̄+1 (กลางซ้าย): แนวนอนตรง -->
  <line class="wire-thick" x1="70" y1="200" x2="285" y2="200"/>
  <text x="210" y="185" class="label-sm">B[3:0]</text>

  <!-- KEY0 → Edge Detect (กลางซ้าย): แนวนอนตรง -->
  <line class="wire" x1="70" y1="300" x2="110" y2="300"/>
  <text x="77" y="285" class="label-sm">KEY0</text>

  <!-- KEY1 → Edge Detect (กลางซ้าย): แนวนอนตรง -->
  <line class="wire" x1="70" y1="340" x2="110" y2="340"/>
  <text x="77" y="325" class="label-sm">KEY1</text>

  <!-- press0 (Edge Detect กลางขวา) → แยก 2 ทาง: B / B̄+1 + Register -->
  <path class="wire" d="M210,300 H640"/>
  <text x="280" y="285" class="label-sm">press0</text>

  <!-- press0 → B / B̄+1 (ล่างซ้าย): ขึ้นไป -->
  <path class="wire" d="M310,300 V230"/>

  <!-- press0 → Register (ล่างซ้าย): หักขึ้น -->
  <path class="wire" d="M640,300 V150"/>

  <!-- Junction dot press0 -->
  <circle cx="310" cy="300" r="3" class="dot"/>

  <!-- press1 (Edge Detect กลางขวา) → แยก 2 ทาง: B / B̄+1 + Register -->
  <path class="wire" d="M210,340 H670"/>
  <text x="280" y="325" class="label-sm">press1</text>

  <!-- press1 → B / B̄+1 (ล่างขวา): ขึ้นไป -->
  <path class="wire" d="M340,340 V230"/>

  <!-- press1 → Register (ล่างขวา): หักขึ้น -->
  <path class="wire" d="M670,340 V150"/>

  <!-- Junction dot press1 -->
  <circle cx="340" cy="340" r="3" class="dot"/>

  <!-- B / B̄+1 กลางขวา → Adder กลางซ้ายล่าง: วิ่งตรง แล้วหักขึ้น -->
  <path class="wire-thick" d="M365,200 H400 V135 H440"/>
  <text x="370" y="185" class="label-sm">B_proc</text>

  <!-- Adder กลางขวา → Register กลางซ้าย: แนวนอนตรง -->
  <line class="wire-thick" x1="520" y1="120" x2="595" y2="120"/>
  <text x="557" y="105" class="label-sm">result</text>

  <!-- Register กลางขวา → Sign &amp; Abs กลางซ้าย: แนวนอนตรง -->
  <line class="wire-thick" x1="715" y1="120" x2="790" y2="120"/>
  <text x="752" y="105" class="label-sm">result</text>

  <!-- Sign &amp; Abs ด้านขวาล่าง → bin_to_bcd กลางซ้าย: แนวนอนตรง -->
  <line class="wire-thick" x1="890" y1="130" x2="965" y2="130"/>
  <text x="930" y="115" class="label-sm">abs_result</text>

  <!-- bin_to_bcd bcd1 (กลางขวา) → bcd_to_7seg tens (กลางซ้าย): ออกแนวนอน แล้วหักขึ้น -->
  <path class="wire-thick" d="M1075,115 H1105 V95 H1145"/>
  <text x="1080" y="100" class="label-sm">bcd1</text>

  <!-- bin_to_bcd bcd0 (กลางขวา) → bcd_to_7seg units (กลางซ้าย): ออกแนวนอน แล้วหักลง -->
  <path class="wire-thick" d="M1075,145 H1105 V165 H1145"/>
  <text x="1080" y="180" class="label-sm">bcd0</text>

  <!-- bcd_to_7seg tens กลางขวา → HEX1: แนวนอนตรง -->
  <line class="wire-thick" x1="1255" y1="95" x2="1270" y2="95"/>

  <!-- bcd_to_7seg units กลางขวา → HEX0: แนวนอนตรง -->
  <line class="wire-thick" x1="1255" y1="165" x2="1270" y2="165"/>

  <!-- negative (Sign &amp; Abs ด้านขวาบน) → HEX2: ออกแนวนอน แล้วหักขึ้น -->
  <path class="wire" d="M890,95 H910 V40 H1270"/>
  <text x="1095" y="25" class="label-sm">negative</text>

  <!-- ============ TITLE ============ -->
  <text x="620" y="400" class="label" font-size="15" font-weight="bold">Basic Calculator (เครื่องคิดเลขพื้นฐาน)</text>
  <text x="620" y="422" class="label-sm">KEY0 = Add (A + B), KEY1 = Subtract (A + <tspan text-decoration="overline">B</tspan> + 1) — press updates Register, result holds until next press (กดปุ่ม = update — ผลลัพธ์ค้างจนกว่าจะกดปุ่มใหม่)</text>
</svg>
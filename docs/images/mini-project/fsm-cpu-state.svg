<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="sans-serif">
  <style>
    .state { fill: white; stroke: #333; stroke-width: 2.5; }
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .name { text-anchor: middle; font-size: 17px; font-weight: bold; fill: #333; }
    .code { text-anchor: middle; font-size: 13px; fill: #888; }
    .cond { text-anchor: middle; font-size: 13px; font-weight: bold; fill: #333; }
    .out { text-anchor: middle; font-size: 11px; fill: #444; }
    .title { text-anchor: middle; font-size: 15px; font-weight: bold; fill: #333; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- states (Moore: outputs อยู่ใน bubble) -->
  <circle class="state" cx="150" cy="200" r="70"/>
  <text x="150" y="172" class="name">FETCH<tspan class="code">/00</tspan></text>
  <text x="150" y="196" class="out">instr &lt;= ROM[PC]</text>
  <text x="150" y="211" class="out">PC &lt;= PC + 1</text>

  <circle class="state" cx="480" cy="200" r="70"/>
  <text x="480" y="172" class="name">EXECUTE<tspan class="code">/01</tspan></text>
  <text x="480" y="196" class="out">ทำงานตาม opcode:</text>
  <text x="480" y="211" class="out">push / pop / ALU</text>
  <text x="480" y="226" class="out">MUL ใช้หลาย cycle ได้</text>

  <circle class="state" cx="810" cy="200" r="70"/>
  <text x="810" y="172" class="name">HALT<tspan class="code">/10</tspan></text>
  <text x="810" y="196" class="out">คงค่าทุกอย่างไว้</text>
  <text x="810" y="211" class="out">จนกว่า reset</text>

  <!-- FETCH self-loop (tick = 0) -->
  <path class="wire" d="M 98,244 C 45,289 45,111 98,158" marker-end="url(#arrow)"/>
  <text x="76" y="136" class="cond">tick = 0</text>

  <!-- FETCH -> EXECUTE (tick = 1) -->
  <line class="wire" x1="220" y1="200" x2="410" y2="200" marker-end="url(#arrow)"/>
  <text x="315" y="186" class="cond">tick = 1</text>

  <!-- EXECUTE -> FETCH (opcode ≠ HALT) — arc ใต้ -->
  <path class="wire" d="M 480,270 C 480,340 150,340 150,270" marker-end="url(#arrow)"/>
  <text x="315" y="325" class="cond">opcode ≠ HALT</text>

  <!-- EXECUTE -> HALT (opcode = HALT) — arc บน -->
  <path class="wire" d="M 480,130 C 480,50 810,50 810,130" marker-end="url(#arrow)"/>
  <text x="645" y="55" class="cond">opcode = HALT</text>

  <!-- HALT -> FETCH (reset) — U สมมาตร ออกก้นวง HALT เข้าก้นวง FETCH -->
  <path class="wire" d="M 810,270 C 810,400 150,400 150,270" marker-end="url(#arrow)"/>
  <text x="480" y="392" class="cond">reset (KEY1)</text>

  <!-- TITLE -->
  <text x="480" y="425" class="title">FSM State Diagram (Moore)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="sans-serif">
  <style>
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .guide { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .tick { stroke: #bbb; stroke-width: 1; stroke-dasharray: 2 4; }
    .sig { font-size: 13px; fill: #333; font-weight: bold; }
    .pin { font-size: 10px; fill: #888; }
    .note { font-size: 11px; fill: #666; }
    .axis-label { font-size: 11px; fill: #666; }
  </style>

  <!-- vertical grid -->
  <line class="grid" x1="80" y1="16" x2="80" y2="236"/>
  <line class="grid" x1="160" y1="16" x2="160" y2="236"/>
  <line class="grid" x1="240" y1="16" x2="240" y2="236"/>
  <line class="grid" x1="320" y1="16" x2="320" y2="236"/>
  <line class="grid" x1="400" y1="16" x2="400" y2="236"/>

  <!-- sampling ticks at rising edges -->
  <line class="tick" x1="160" y1="28" x2="160" y2="228"/>
  <line class="tick" x1="320" y1="28" x2="320" y2="228"/>

  <!-- CLK (KEY0) : active-low button, pressed = 0, released = 1 -->
  <text x="8" y="44" class="sig">CLK</text>
  <text x="8" y="58" class="pin">(KEY0)</text>
  <polyline class="wire" points="80,52 160,52 160,28 240,28 240,52 320,52 320,28 400,28"/>
  <text x="160" y="70" class="note" text-anchor="middle">↑</text>
  <text x="240" y="70" class="note" text-anchor="middle">↓</text>
  <text x="320" y="70" class="note" text-anchor="middle">↑</text>

  <!-- D (SW0) -->
  <text x="8" y="104" class="sig">D</text>
  <text x="8" y="118" class="pin">(SW0)</text>
  <polyline class="wire" points="80,88 240,88 240,112 400,112"/>

  <!-- annotation -->
  <text x="240" y="180" class="note" text-anchor="middle">ขอบขึ้น (ปล่อย KEY0) = จุดที่ Q เปลี่ยนได้</text>

  <!-- Q (LED0) : blank for students -->
  <text x="8" y="216" class="sig">Q</text>
  <text x="8" y="230" class="pin">(LED0)</text>
  <line class="guide" x1="80" y1="200" x2="400" y2="200"/>
  <line class="guide" x1="80" y1="224" x2="400" y2="224"/>

  <!-- time axis -->
  <line class="wire" x1="80" y1="252" x2="394" y2="252"/>
  <polyline class="wire" points="394,248 400,252 394,256"/>
  <text x="400" y="268" class="axis-label" text-anchor="end">เวลา →</text>
</svg>

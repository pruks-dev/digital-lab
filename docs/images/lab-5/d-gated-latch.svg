<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif">
  <style>
    .gate { fill: white; stroke: #333; stroke-width: 2; }
    .wire { stroke: #333; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #333; stroke-width: 2.5; fill: none; }
    .label { text-anchor: middle; font-size: 14px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
  </style>

  <!-- NAND1 (input stage, top) -->
  <path class="gate" d="M 120,100 L 120,40 L 180,40 A 30,30 0 0 1 180,100 Z"/>
  <circle cx="186" cy="70" r="4" fill="white" stroke="#333" stroke-width="2"/>
  <text x="150" y="32" class="label-sm">NAND1</text>

  <!-- NAND2 (input stage, bottom) -->
  <path class="gate" d="M 120,190 L 120,130 L 180,130 A 30,30 0 0 1 180,190 Z"/>
  <circle cx="186" cy="160" r="4" fill="white" stroke="#333" stroke-width="2"/>
  <text x="150" y="124" class="label-sm">NAND2</text>

  <!-- NAND3 (cross-coupled, top) -->
  <path class="gate" d="M 320,100 L 320,40 L 380,40 A 30,30 0 0 1 380,100 Z"/>
  <circle cx="386" cy="70" r="4" fill="white" stroke="#333" stroke-width="2"/>
  <text x="350" y="32" class="label-sm">NAND3</text>

  <!-- NAND4 (cross-coupled, bottom) -->
  <path class="gate" d="M 320,190 L 320,130 L 380,130 A 30,30 0 0 1 380,190 Z"/>
  <circle cx="386" cy="160" r="4" fill="white" stroke="#333" stroke-width="2"/>
  <text x="350" y="124" class="label-sm">NAND4</text>

  <!-- Inverter for D -->
  <polyline class="gate" points="15,130 45,145 15,160" fill="white"/>
  <circle cx="51" cy="145" r="3.5" fill="white" stroke="#333" stroke-width="1.5"/>

  <!-- D input -->
  <line class="wire-thick" x1="10" y1="52" x2="120" y2="52"/>
  <text x="10" y="47" class="label" font-weight="bold">D</text>

  <!-- D branch to inverter -->
  <line class="wire" x1="10" y1="52" x2="10" y2="145"/>
  <line class="wire" x1="10" y1="145" x2="15" y2="145"/>

  <!-- E input -->
  <line class="wire-thick" x1="30" y1="88" x2="120" y2="88"/>
  <text x="30" y="83" class="label" font-weight="bold">E</text>

  <!-- E branch to NAND2 bottom -->
  <line class="wire" x1="48" y1="88" x2="48" y2="178"/>
  <line class="wire" x1="48" y1="178" x2="120" y2="178"/>

  <!-- D̄ from inverter to NAND2 top -->
  <line class="wire" x1="51" y1="145" x2="60" y2="145"/>
  <line class="wire" x1="60" y1="145" x2="60" y2="142"/>
  <line class="wire" x1="60" y1="142" x2="120" y2="142"/>
  <text x="88" y="138" class="label-sm">D̅</text>

  <!-- S̄ from NAND1 to NAND3 top -->
  <line class="wire" x1="186" y1="70" x2="186" y2="52"/>
  <line class="wire" x1="186" y1="52" x2="320" y2="52"/>
  <text x="253" y="46" class="label-sm">S̅</text>

  <!-- R̄ from NAND2 to NAND4 top -->
  <line class="wire" x1="186" y1="160" x2="186" y2="142"/>
  <line class="wire" x1="186" y1="142" x2="320" y2="142"/>
  <text x="253" y="136" class="label-sm">R̅</text>

  <!-- Q̄ feedback: from NAND4 output, over the top, into NAND3 bottom input -->
  <line class="wire" x1="386" y1="160" x2="450" y2="160"/>
  <line class="wire" x1="450" y1="160" x2="450" y2="20"/>
  <line class="wire" x1="450" y1="20" x2="300" y2="20"/>
  <line class="wire" x1="300" y1="20" x2="300" y2="88"/>
  <line class="wire" x1="300" y1="88" x2="320" y2="88"/>

  <!-- Q feedback: from NAND3 output, around the bottom, into NAND4 bottom input -->
  <line class="wire" x1="440" y1="70" x2="470" y2="70"/>
  <line class="wire" x1="470" y1="70" x2="470" y2="225"/>
  <line class="wire" x1="470" y1="225" x2="300" y2="225"/>
  <line class="wire" x1="300" y1="225" x2="300" y2="178"/>
  <line class="wire" x1="300" y1="178" x2="320" y2="178"/>

  <!-- Q output -->
  <line class="wire-thick" x1="386" y1="70" x2="440" y2="70"/>
  <text x="448" y="74" class="label" font-weight="bold">Q</text>

  <!-- Q̄ output -->
  <line class="wire-thick" x1="386" y1="160" x2="440" y2="160"/>
  <text x="448" y="164" class="label" font-weight="bold">Q̅</text>
</svg>
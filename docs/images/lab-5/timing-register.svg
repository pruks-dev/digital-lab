<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" font-family="sans-serif">
  <style>
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .bus { stroke: #333; stroke-width: 2; fill: none; }
    .tick { stroke: #bbb; stroke-width: 1; stroke-dasharray: 2 4; }
    .blank { stroke: #aaa; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
    .sig { font-size: 13px; fill: #333; font-weight: bold; }
    .pin { font-size: 10px; fill: #888; }
    .val { font-size: 11px; fill: #333; text-anchor: middle; }
    .hint { font-size: 11px; fill: #999; text-anchor: middle; }
    .axis-label { font-size: 11px; fill: #666; }
  </style>

  <!-- vertical grid -->
  <line class="grid" x1="80" y1="16" x2="80" y2="246"/>
  <line class="grid" x1="136" y1="16" x2="136" y2="246"/>
  <line class="grid" x1="192" y1="16" x2="192" y2="246"/>
  <line class="grid" x1="248" y1="16" x2="248" y2="246"/>
  <line class="grid" x1="304" y1="16" x2="304" y2="246"/>
  <line class="grid" x1="360" y1="16" x2="360" y2="246"/>
  <line class="grid" x1="416" y1="16" x2="416" y2="246"/>
  <line class="grid" x1="472" y1="16" x2="472" y2="246"/>
  <line class="grid" x1="520" y1="16" x2="520" y2="246"/>

  <!-- sampling ticks at rising edges -->
  <line class="tick" x1="136" y1="28" x2="136" y2="240"/>
  <line class="tick" x1="248" y1="28" x2="248" y2="240"/>
  <line class="tick" x1="360" y1="28" x2="360" y2="240"/>
  <line class="tick" x1="472" y1="28" x2="472" y2="240"/>

  <!-- CLK (KEY0) : active-low button, pressed = 0, released = 1 -->
  <text x="8" y="44" class="sig">CLK</text>
  <text x="8" y="58" class="pin">(KEY0)</text>
  <polyline class="wire" points="80,52 136,52 136,28 192,28 192,52 248,52 248,28 304,28 304,52 360,52 360,28 416,28 416,52 472,52 472,28 520,28"/>

  <!-- D[3:0] bus (SW3-SW0) -->
  <text x="8" y="96" class="sig">D[3:0]</text>
  <text x="8" y="110" class="pin">(SW3–SW0)</text>
  <!-- top line with gaps at transitions -->
  <line class="bus" x1="80" y1="82" x2="156" y2="82"/>
  <line class="bus" x1="172" y1="82" x2="268" y2="82"/>
  <line class="bus" x1="284" y1="82" x2="380" y2="82"/>
  <line class="bus" x1="396" y1="82" x2="520" y2="82"/>
  <!-- bottom line with gaps at transitions -->
  <line class="bus" x1="80" y1="118" x2="156" y2="118"/>
  <line class="bus" x1="172" y1="118" x2="268" y2="118"/>
  <line class="bus" x1="284" y1="118" x2="380" y2="118"/>
  <line class="bus" x1="396" y1="118" x2="520" y2="118"/>
  <!-- X transitions -->
  <line class="bus" x1="156" y1="82" x2="172" y2="118"/>
  <line class="bus" x1="156" y1="118" x2="172" y2="82"/>
  <line class="bus" x1="268" y1="82" x2="284" y2="118"/>
  <line class="bus" x1="268" y1="118" x2="284" y2="82"/>
  <line class="bus" x1="380" y1="82" x2="396" y2="118"/>
  <line class="bus" x1="380" y1="118" x2="396" y2="82"/>
  <!-- bus values -->
  <text x="122" y="74" class="val">0000</text>
  <text x="226" y="74" class="val">0101</text>
  <text x="338" y="74" class="val">1010</text>
  <text x="458" y="74" class="val">1111</text>

  <!-- Q[3:0] blank band for students -->
  <text x="8" y="210" class="sig">Q[3:0]</text>
  <text x="8" y="224" class="pin">(LED3–LED0)</text>
  <rect class="blank" x="80" y="196" width="440" height="36"/>
  <text x="300" y="218" class="hint">นักศึกษาวาดค่า Q หลังขอบขึ้นแต่ละจุด (เส้นประแนวตั้ง)</text>

  <!-- time axis -->
  <line class="wire" x1="80" y1="262" x2="514" y2="262"/>
  <polyline class="wire" points="514,258 520,262 514,266"/>
  <text x="520" y="278" class="axis-label" text-anchor="end">เวลา →</text>
</svg>

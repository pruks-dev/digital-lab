<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" font-family="sans-serif">
  <style>
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .label { text-anchor: middle; font-size: 14px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
  </style>

  <text x="30" y="25" class="label" font-weight="bold">CLK</text>

  <polyline class="wire" points="30,40 60,40 60,10 90,10 90,40 120,40 120,10 150,10 150,40 180,40 180,10 210,10 210,40 240,40 240,10 270,10 270,40 300,40 300,10 330,10 330,40 360,40 360,10 390,10 390,40"/>

  <!-- Rising edge labels (ตรงกับขอบขึ้นที่ x = 60, 120, 180, 240, 300, 360) -->
  <text x="60" y="60" class="label-sm">↑</text>
  <text x="120" y="60" class="label-sm">↑</text>
  <text x="180" y="60" class="label-sm">↑</text>
  <text x="240" y="60" class="label-sm">↑</text>
  <text x="300" y="60" class="label-sm">↑</text>
  <text x="360" y="60" class="label-sm">↑</text>

  <!-- Falling edge labels (ตรงกับขอบตกที่ x = 90, 150, 210, 270, 330, 390) -->
  <text x="90" y="60" class="label-sm">↓</text>
  <text x="150" y="60" class="label-sm">↓</text>
  <text x="210" y="60" class="label-sm">↓</text>
  <text x="270" y="60" class="label-sm">↓</text>
  <text x="330" y="60" class="label-sm">↓</text>
  <text x="390" y="60" class="label-sm">↓</text>

  <!-- Period arrow: ระหว่างขอบขึ้นที่ 60 ถึง 120 -->
  <line class="wire" x1="60" y1="80" x2="120" y2="80"/>
  <polyline class="wire" points="60,75 60,85" fill="none"/>
  <polyline class="wire" points="120,75 120,85" fill="none"/>
  <text x="90" y="95" class="label-sm">T (period)</text>
</svg>

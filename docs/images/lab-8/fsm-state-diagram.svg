<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="sans-serif">
  <style>
    .state { fill: white; stroke: #333; stroke-width: 2.5; }
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .name { text-anchor: middle; font-size: 17px; font-weight: bold; fill: #333; }
    .code { text-anchor: middle; font-size: 13px; fill: #888; }
    .cond { text-anchor: middle; font-size: 13px; font-weight: bold; fill: #333; }
    .out { text-anchor: middle; font-size: 11px; fill: #444; }
    .title { text-anchor: middle; font-size: 15px; font-weight: bold; fill: #333; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- states (Moore: outputs อยู่ใน bubble) -->
  <circle class="state" cx="120" cy="200" r="65"/>
  <text x="120" y="172" class="name">IDLE<tspan class="code">/00</tspan></text>
  <text x="120" y="196" class="out">a_reg &lt;= A</text>
  <text x="120" y="211" class="out">b_reg &lt;= B</text>
  <text x="120" y="226" class="out">acc &lt;= 0</text>
  <text x="120" y="241" class="out">i &lt;= 0</text>

  <circle class="state" cx="370" cy="200" r="65"/>
  <text x="370" y="172" class="name">ADD<tspan class="code">/01</tspan></text>
  <text x="370" y="196" class="out">b_reg(0) = 1 ⟹</text>
  <text x="370" y="211" class="out">acc &lt;= acc + a_reg</text>

  <circle class="state" cx="620" cy="200" r="65"/>
  <text x="620" y="172" class="name">SHIFT<tspan class="code">/10</tspan></text>
  <text x="620" y="196" class="out">a_reg &lt;= a_reg &lt;&lt; 1</text>
  <text x="620" y="211" class="out">b_reg &lt;= b_reg &gt;&gt; 1</text>
  <text x="620" y="226" class="out">i &lt;= i + 1</text>

  <circle class="state" cx="870" cy="200" r="65"/>
  <text x="870" y="172" class="name">DONE<tspan class="code">/11</tspan></text>
  <text x="870" y="196" class="out">done &lt;= 1</text>

  <!-- IDLE self-loop (start = 0) — ทางซ้ายของวงกลม -->
  <path class="wire" d="M 70,242 C 17,287 17,113 70,158" marker-end="url(#arrow)"/>
  <text x="48" y="136" class="cond">start = 0</text>

  <!-- IDLE -> ADD (start) -->
  <line class="wire" x1="185" y1="200" x2="305" y2="200" marker-end="url(#arrow)"/>
  <text x="245" y="186" class="cond">start = 1</text>

  <!-- ADD -> SHIFT (i < 3) -->
  <line class="wire" x1="435" y1="200" x2="555" y2="200" marker-end="url(#arrow)"/>
  <text x="495" y="186" class="cond">i &lt; 3</text>

  <!-- ADD -> DONE (i = 3) — arc บนผ่านเหนือ SHIFT -->
  <path class="wire" d="M 370,135 C 370,55 870,55 870,135" marker-end="url(#arrow)"/>
  <text x="620" y="60" class="cond">i = 3</text>

  <!-- SHIFT -> ADD — arc ใต้ (กลับเข้า ADD เสมอ ไม่มีเงื่อนไข) -->
  <path class="wire" d="M 620,265 C 620,330 370,330 370,265" marker-end="url(#arrow)"/>

  <!-- DONE -> IDLE — U สมมาตร ออกก้นวง DONE เข้าก้นวง IDLE -->
  <path class="wire" d="M 870,265 C 870,415 120,415 120,265" marker-end="url(#arrow)"/>

  <!-- TITLE -->
  <text x="495" y="415" class="title">FSM State Diagram (Moore)</text>
</svg>

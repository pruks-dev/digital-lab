<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 284" font-family="sans-serif">
  <style>
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .guide { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .sig { font-size: 13px; fill: #333; font-weight: bold; }
    .pin { font-size: 10px; fill: #888; }
    .axis-label { font-size: 11px; fill: #666; }
  </style>

  <!-- vertical grid -->
  <line class="grid" x1="80" y1="16" x2="80" y2="246"/>
  <line class="grid" x1="142" y1="16" x2="142" y2="246"/>
  <line class="grid" x1="204" y1="16" x2="204" y2="246"/>
  <line class="grid" x1="266" y1="16" x2="266" y2="246"/>
  <line class="grid" x1="328" y1="16" x2="328" y2="246"/>
  <line class="grid" x1="390" y1="16" x2="390" y2="246"/>
  <line class="grid" x1="452" y1="16" x2="452" y2="246"/>

  <!-- E (SW2) -->
  <text x="8" y="44" class="sig">E</text>
  <text x="8" y="58" class="pin">(SW2)</text>
  <polyline class="wire" points="80,28 266,28 266,52 390,52 390,28 452,28"/>

  <!-- S (SW0) -->
  <text x="8" y="104" class="sig">S</text>
  <text x="8" y="118" class="pin">(SW0)</text>
  <polyline class="wire" points="80,88 142,88 142,112 204,112 204,88 266,88 266,112 390,112 390,88 452,88"/>

  <!-- R (SW1) -->
  <text x="8" y="164" class="sig">R</text>
  <text x="8" y="178" class="pin">(SW1)</text>
  <polyline class="wire" points="80,172 142,172 142,148 204,148 204,172 266,172 266,148 390,148 390,172 452,172"/>

  <!-- Q (LED0) : blank for students -->
  <text x="8" y="226" class="sig">Q</text>
  <text x="8" y="240" class="pin">(LED0)</text>
  <line class="guide" x1="80" y1="210" x2="452" y2="210"/>
  <line class="guide" x1="80" y1="234" x2="452" y2="234"/>

  <!-- time axis -->
  <line class="wire" x1="80" y1="262" x2="446" y2="262"/>
  <polyline class="wire" points="446,258 452,262 446,266"/>
  <text x="452" y="278" class="axis-label" text-anchor="end">เวลา →</text>
</svg>

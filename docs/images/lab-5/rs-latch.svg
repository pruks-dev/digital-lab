<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="sans-serif">
  <style>
    .gate { fill: white; stroke: #333; stroke-width: 2; }
    .wire { stroke: #333; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #333; stroke-width: 2.5; fill: none; }
    .label { text-anchor: middle; font-size: 14px; fill: #333; }
    .label-sm { text-anchor: middle; font-size: 11px; fill: #666; }
  </style>

  <!-- NAND1 (top gate) -->
  <path class="gate" d="M 120,100 L 120,40 L 180,40 A 30,30 0 0 1 180,100 Z"/>
  <circle cx="186" cy="70" r="4" fill="white" stroke="#333" stroke-width="2"/>

  <!-- NAND2 (bottom gate) -->
  <path class="gate" d="M 120,190 L 120,130 L 180,130 A 30,30 0 0 1 180,190 Z"/>
  <circle cx="186" cy="160" r="4" fill="white" stroke="#333" stroke-width="2"/>

  <!-- S̄ input -->
  <line class="wire" x1="10" y1="52" x2="120" y2="52"/>
  <text x="10" y="47" class="label" font-weight="bold">S̅</text>

  <!-- R̄ input -->
  <line class="wire" x1="10" y1="142" x2="120" y2="142"/>
  <text x="10" y="137" class="label" font-weight="bold">R̅</text>

  <!-- Q̄ feedback: from NAND2 output, over the top, into NAND1 bottom input -->
  <line class="wire" x1="190" y1="160" x2="235" y2="160"/>
  <line class="wire" x1="235" y1="160" x2="235" y2="28"/>
  <line class="wire" x1="235" y1="28" x2="98" y2="28"/>
  <line class="wire" x1="98" y1="28" x2="98" y2="88"/>
  <line class="wire" x1="98" y1="88" x2="120" y2="88"/>

  <!-- Q feedback: from NAND1 output, around the bottom, into NAND2 bottom input -->
  <line class="wire" x1="190" y1="70" x2="285" y2="70"/>
  <line class="wire" x1="285" y1="70" x2="285" y2="215"/>
  <line class="wire" x1="285" y1="215" x2="98" y2="215"/>
  <line class="wire" x1="98" y1="215" x2="98" y2="178"/>
  <line class="wire" x1="98" y1="178" x2="120" y2="178"/>

  <!-- Q output -->
  <line class="wire-thick" x1="190" y1="70" x2="330" y2="70"/>
  <text x="338" y="74" class="label" font-weight="bold">Q</text>

  <!-- Q̄ output -->
  <line class="wire-thick" x1="190" y1="160" x2="330" y2="160"/>
  <text x="338" y="164" class="label" font-weight="bold">Q̅</text>
</svg>
